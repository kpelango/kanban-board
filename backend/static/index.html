<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Studio - Scaffolding</title>
  <style>
    :root {
      --accent-yellow: #ecad0a;
      --primary-blue: #209dd7;
      --secondary-purple: #753991;
      --navy-dark: #032147;
      --gray-text: #888888;
      --surface: #f7f8fb;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--surface);
      color: var(--navy-dark);
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 18px 40px rgba(3, 33, 71, 0.12);
      border-top: 6px solid var(--accent-yellow);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      color: var(--navy-dark);
    }
    p {
      margin: 0 0 20px;
      color: var(--gray-text);
      line-height: 1.5;
    }
    .status {
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--surface);
      font-weight: 600;
      color: var(--primary-blue);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hello World</h1>
    <p>Kanban Studio FastAPI scaffolding is running locally in Docker.</p>
    <div id="api-status" class="status">Checking /api/health...</div>
  </main>
  <script>
    fetch("/api/health")
      .then((res) => res.json())
      .then((data) => {
        document.getElementById("api-status").textContent =
          "API Status: " + data.status + " - " + data.message;
      })
      .catch((err) => {
        document.getElementById("api-status").textContent =
          "API Error: " + err.message;
      });
  </script>
</body>
</html>
